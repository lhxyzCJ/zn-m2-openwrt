# ZN-M2 固件 / 软件包云编译（官方 openwrt/openwrt + 本目录移植补丁）
#
# 两种模式（Actions → Run workflow → mode）：
#   firmware: 编完整固件；用最终镜像的 .manifest 逐项核验 seed 里的包，缺包直接失败。
#   packages: 只编 configs/zn_m2.config 选中的包（含 kmod-nft-queue），不生成镜像。
#
# 重要：kmod 依赖 kernel=6.18.55~<内核 config hash>-r1。改 config（例如加 kmod-nft-queue）
# 会改 hash；单独编的 kmod 装不进用旧 config 编的固件。现网要补 kmod，实际可行的是重刷新固件。
# 同一次 firmware 构建产出的 packages 才与镜像同 key、同 vermagic。

name: Build ZN-M2 (qualcommax/ipq60xx)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建内容'
        required: true
        default: firmware
        type: choice
        options:
          - firmware
          - packages
      upstream:
        description: 'openwrt/openwrt ref（分支/tag/SHA；packages 要与固件同源时填固件的 upstream）'
        required: true
        default: main
  schedule:
    - cron: '17 19 * * 0'        # 每周一 03:17（UTC+8）自动跟上游重建
  push:
    branches: [master, main]
    paths:
      - 'apply.sh'
      - 'packages/**'
      - 'patches/**'
      - 'files/**'
      - 'configs/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

# 同一 ref 只跑一个：避免两个 runner 并行各烧一份编译、也避免同时往 Release 写。
# 不动 cancel-in-progress —— 正在跑的构建（可能要 1 小时）不该被一次 push 砍掉，
# 新 push 排队等它跑完（GitHub 只保留一个 pending）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  MODE: ${{ github.event.inputs.mode || 'firmware' }}
  UPSTREAM: ${{ github.event.inputs.upstream || 'main' }}
  # ccache：必须走 env，写进 configs/*.config 是无效的 —— 上游把 `config CCACHE`
  # 关在 DEVEL 菜单里（`bool "Use ccache" if DEVEL`），DEVEL=n 时该符号不进 .config，
  # make defconfig 会把种子那行静默丢掉。rules.mk 只检查 make 变量，所以 env 生效，
  # 把 TARGET_CC/HOSTCC 全套上 ccache（toolchain/内核/host 工具/包全在内），
  # 缓存目录 <树>/.ccache（CCACHE_DIR 默认值，CCACHE_BASEDIR=<树> 保证跨 run 路径一致）。
  CONFIG_CCACHE: "y"
  # 下面三个变量是"能不能命中"的关键，不是可选优化：
  #   COMPILERCHECK=content：toolchain 每次都是新编出来的，默认按 mtime 校验
  #     编译器 → 每次 run 全 miss；按内容校验才有命中。
  #   SLOPPINESS/NOHASHDIR：容忍重新生成的头文件时间戳、不把 CWD 计入 hash。
  #   MAXSIZE：仓库 Actions cache 上限 10 GiB（当前 dl 占约 2 GiB）。
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: file_stat_matches,time_macros,include_file_ctime,include_file_mtime
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350          # GitHub 托管 runner 硬上限 360 分钟

    steps:
      - name: 取本仓
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 参数
        id: meta
        run: |
          tag=$(date +%Y.%m.%d-%H%M)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = firmware ]; then
            echo "artifact=zn-m2-$tag" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=zn-m2-packages-$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$MODE upstream=$UPSTREAM tag=$tag"

      - name: 机器规格（并行度就由它决定）
        run: |
          echo "nproc=$(nproc)"; lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)' || true
          free -g; df -h / | tail -1

      # OpenWrt 全量编译要 20–30G，标准 runner 的根分区可用空间有限，
      # 不清盘很容易死在 "No space left on device"。
      - name: 腾磁盘
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget curl ccache subversion time \
            uuid-dev liblz4-dev liblzma-dev libselinux1-dev

      - name: 拉官方源码（${{ env.UPSTREAM }}）
        id: upstream
        run: |
          git init openwrt
          git -C openwrt remote add origin "$REPO_URL"
          git -C openwrt fetch --depth 1 origin "$UPSTREAM"
          git -C openwrt checkout --detach FETCH_HEAD
          {
            git -C openwrt log -1 --format='%H %cd %s'
            echo "repo $GITHUB_SHA"
          } | tee upstream.txt
          echo "sha=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 打 ZN M2 移植补丁（含树外包 packages/*）
        run: sh apply.sh openwrt

      # 固定 apk 签名 key：对应 package/Makefile 的 BUILD_KEY_APK_SEC/PUB
      # （<树>/private-key.pem、<树>/public-key.pem）。key 已存在 → make 不再随机生成，
      # 于是每次构建的包/索引签名与 key 都稳定，镜像里 /etc/apk/keys/public-key.pem
      # 也随之固定，Release 上的包集可以直接 apk add（不必 --allow-untrusted）。
      - name: 固定 apk 签名密钥
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          [ -n "$APK_PRIVATE_KEY" ] || { echo "::error::缺少 secret APK_PRIVATE_KEY"; exit 1; }
          printf '%s\n' "$APK_PRIVATE_KEY" > openwrt/private-key.pem
          chmod 600 openwrt/private-key.pem
          grep -q '^-----BEGIN EC PRIVATE KEY-----$' openwrt/private-key.pem
          cp configs/public-key.pem openwrt/public-key.pem
          # 公钥必须是私钥推出来的那一把，否则签名对不上
          openssl ec -in openwrt/private-key.pem -pubout 2>/dev/null | diff -q - openwrt/public-key.pem
          echo "key id: $(openssl ec -pubin -in openwrt/public-key.pem -outform DER 2>/dev/null | sha256sum | cut -c1-16)"

      - name: feeds 与 config
        run: |
          cd openwrt
          cp ../configs/feeds.conf feeds.conf      # 精简 feeds：只 packages + luci
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../configs/zn_m2.config .config
          make defconfig

          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y' .config
          grep -q '^CONFIG_PACKAGE_ipq-wifi-zn_m2=y' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y' .config

          # seed 里每个 CONFIG_PACKAGE_*=[ym] 都必须在 defconfig 后原样存在（=m 的
          # “只编包不进镜像”也必须落地，否则 feed 里会静默少包）。
          # 但只看 defconfig 不够：=y 的最终还要在镜像 manifest 里核验（见后面的步骤）。
          missing=0
          while IFS= read -r line; do
            if ! grep -qxF "$line" .config; then
              echo "::error title=defconfig 丢弃了 ${line}::${line} 没有进入 .config"
              missing=1
            fi
          done < <(sed -n 's/^\(CONFIG_PACKAGE_[^=]*=[ym]\)$/\1/p' ../configs/zn_m2.config)
          [ "$missing" -eq 0 ]

      - name: 缓存已下载的源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('configs/zn_m2.config') }}-${{ steps.upstream.outputs.sha }}
          restore-keys: dl-

      # ccache 目录：<树>/.ccache（rules.mk 的默认 CCACHE_DIR）。
      # key 先按 upstream+config 精确命中；命中不了就退到同 upstream、再退到任意旧缓存
      # —— ccache 自己会按内容判断单个 .o 能不能用，给错缓存也不会出错，只是白跑。
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ steps.upstream.outputs.sha }}-${{ hashFiles('configs/zn_m2.config') }}
          restore-keys: |
            ccache-${{ steps.upstream.outputs.sha }}-
            ccache-

      - name: 下载源码包
        run: cd openwrt && (make -j"$(nproc)" download || make -j1 download V=s)

      - name: 编译固件
        if: steps.meta.outputs.mode == 'firmware'
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      # 单独编包：target/compile 会先把 toolchain + 内核（含 .ko）编好，
      # 否则 kmod 包没有可打包的模块。不跑 target/install，所以不出镜像。
      - name: 编译 packages（不生成镜像）
        if: steps.meta.outputs.mode == 'packages'
        run: |
          cd openwrt
          build() {
            make -j"$(nproc)" "$@" || make -j1 V=s "$@"
          }
          build tools/install
          build toolchain/install
          build target/compile
          build package/cleanup
          build package/compile
          build package/index

      - name: 校验固件里的包
        if: steps.meta.outputs.mode == 'firmware'
        run: |
          cd openwrt
          manifest=$(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -name '*zn_m2*.manifest' -print -quit)
          [ -n "$manifest" ] || { echo "::error::没有生成 zn_m2 manifest"; exit 1; }

          # 以最终镜像的 manifest 为准，而不是 .config：defconfig 选中了、
          # 编译时又被丢弃/没装进 rootfs 的包，只有这里能抓到。
          missing=0
          while IFS= read -r pkg; do
            if ! awk -v p="$pkg" '$1==p {found=1} END {exit !found}' "$manifest"; then
              echo "::error title=镜像缺少 ${pkg}::${pkg} 不在 $(basename "$manifest") 里"
              missing=1
            fi
          done < <(sed -n 's/^CONFIG_PACKAGE_\(.*\)=y$/\1/p' ../configs/zn_m2.config)
          [ "$missing" -eq 0 ]

          echo "--- 关键包 ---"
          for pkg in kmod-nft-queue kmod-rkp-ipid ipq-wifi-zn_m2; do
            if ! awk -v p="$pkg" '$1==p {print; found=1} END {exit !found}' "$manifest"; then
              echo "::error title=镜像缺少 ${pkg}::${pkg} 不在 $(basename "$manifest") 里"
              exit 1
            fi
          done

          ls -lh bin/targets/qualcommax/ipq60xx/
          ls bin/targets/qualcommax/ipq60xx/*zn_m2*sysupgrade* >/dev/null
          # FIT 配置名必须和 u-boot 挑的 config@cp03-c1 对上，否则刷进去起不来
          grep -q 'config@cp03-c1' bin/targets/qualcommax/ipq60xx/*zn_m2*initramfs-uImage.itb

      - name: 校验 packages
        if: steps.meta.outputs.mode == 'packages'
        run: |
          cd openwrt
          missing=0
          while IFS= read -r pkg; do
            if ! find bin -name "${pkg}-*.apk" -print -quit | grep -q .; then
              echo "::error title=缺少 ${pkg} 包::没有找到 ${pkg}-*.apk"
              missing=1
            fi
          done < <(sed -n 's/^CONFIG_PACKAGE_\(.*\)=y$/\1/p' ../configs/zn_m2.config)
          [ "$missing" -eq 0 ]

          echo "--- 关键包 ---"
          find bin -name 'kmod-nft-queue-*.apk' -print
          find bin -name 'kernel-*.apk' -print
          echo "apk 数量: $(find bin -name '*.apk' | wc -l)"
          find bin/packages -maxdepth 3 -name 'packages.adb' -print | head

      - name: 打包产物
        run: |
          mkdir -p out
          cp upstream.txt out/
          cp openwrt/public-key.pem out/ 2>/dev/null || true

          if [ "${{ steps.meta.outputs.mode }}" = firmware ]; then
            cp openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2* out/
          fi

          dirs=()
          if [ -d openwrt/bin/packages ]; then
            dirs+=(bin/packages)
          fi
          if [ -d openwrt/bin/targets/qualcommax/ipq60xx/packages ]; then
            dirs+=(bin/targets/qualcommax/ipq60xx/packages)
          fi
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::没有 packages 目录可打包"
            exit 1
          fi
          tar -czf "out/zn-m2-packages-${{ steps.meta.outputs.tag }}.tar.gz" -C openwrt "${dirs[@]}"

          # 扁平 feed：Release 资产本身当 apk 源用。apk 取包时按"索引 URL 同目录 +
          # <name>-<version>.apk"解析，所以 .apk 必须与索引同目录，索引改名区分各 feed
          # （跨 feed 无重名，实测 209 个）。
          find openwrt/bin/packages openwrt/bin/targets/qualcommax/ipq60xx/packages \
               -name '*.apk' -exec cp -n {} out/ \;
          cp openwrt/bin/packages/aarch64_cortex-a53/base/packages.adb     out/base-packages.adb
          cp openwrt/bin/packages/aarch64_cortex-a53/luci/packages.adb     out/luci-packages.adb
          cp openwrt/bin/packages/aarch64_cortex-a53/packages/packages.adb out/packages-packages.adb
          cp openwrt/bin/targets/qualcommax/ipq60xx/packages/packages.adb  out/target-packages.adb
          # 本机内核身份（= kernel 包名里的 6.18.55~<内核 config hash>-r1）：路由器用它挑
          # 与自己完全匹配的那次构建 —— kmod 的安装资格就是这个 hash 决定的。
          find openwrt/bin -name 'kernel-*.apk' -printf '%f\n' | sed 's/\.apk$//' | head -1 > out/kernel-version.txt
          cat out/kernel-version.txt
          echo "feed 包数: $(find out -name '*.apk' | wc -l)，索引: $(find out -name '*-packages.adb' | wc -l)"
          ls -lh out/ | head -5

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: out/
          retention-days: 14

      - name: 发 Release
        if: steps.meta.outputs.mode == 'firmware'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zn-m2-${{ steps.meta.outputs.tag }}
          name: ZN-M2 ${{ steps.meta.outputs.tag }}
          files: out/*
          body: |
            本仓 @ `${{ github.sha }}`，上游 openwrt/openwrt @ `${{ steps.upstream.outputs.sha }}` + ZN-M2 移植补丁（非下游树），`kmod-rkp-ipid` 同编。

            本 release 同时是**本机内核专用的 apk 源**（`kernel-version.txt` 里是内核身份）：

            ```
            https://github.com/${{ github.repository }}/releases/download/zn-m2-${{ steps.meta.outputs.tag }}/{base,luci,packages,target}-packages.adb
            ```

            在路由器上执行 `sh /root/pkgfeed.sh` 会自动匹配本机内核并把上面四条写进
            `/etc/apk/repositories.d/customfeeds.list`；之后 `apk add kmod-xxx` 直接可用
            （同一次构建、同一内核 config hash、同一签名 key，故 kmod 也能装）。
            `zn-m2-packages-*.tar.gz` 是同内容的打包件，供离线取用。

      - name: 摘要
        if: always()
        run: |
          {
            echo "## ZN-M2 ${{ steps.meta.outputs.mode }} ${{ steps.meta.outputs.tag }}"
            echo "- upstream: \`$(cat upstream.txt 2>/dev/null || echo unknown)\`"
            echo "- artifact: \`${{ steps.meta.outputs.artifact }}\`"
            if [ -f out/kernel-version.txt ]; then
              echo "- 内核身份: \`$(cat out/kernel-version.txt)\`"
              echo "- feed: \`https://github.com/${{ github.repository }}/releases/download/zn-m2-${{ steps.meta.outputs.tag }}/target-packages.adb\`"
            fi
            if [ "${{ steps.meta.outputs.mode }}" = packages ]; then
              echo "- 注意：packages 只有与固件同 upstream + 同 config（=同 kernel-version）才能装入。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
