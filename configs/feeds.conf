# 精简 feeds：这套移植 + 抗检测栈只用到 packages 和 luci。
# 用法：./scripts/feeds update -a && ./scripts/feeds install -a
# （不装 routing/telephony/video，省克隆时间和磁盘；若之后要装别的包再加回来即可）
# 注意：feed 仓没有 main 分支，跟官方 core 的 main 对应的是 master。
src-git packages https://git.openwrt.org/feed/packages.git;master
src-git luci https://git.openwrt.org/project/luci.git;master
