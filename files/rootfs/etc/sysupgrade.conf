## Files and directories preserved by sysupgrade.
##
## Large, regenerable service binaries live in /etc/svc/svc.sq and are
## restored separately; keeping them out of this list makes the backup
## small enough to fit comfortably in rootfs_data.  Everything below is
## either unique user data or the scripts that launch the custom stack.

/etc/sysupgrade.conf

# ---- custom service data / config ----
# /etc/svc/svc.sq is deliberately NOT listed: it is a 15.8 MB image that
# already exists on the build host and is restored after the upgrade.
/etc/wxdet/
/etc/sing-box/
/etc/cloudflared/
/etc/xray/
/etc/hotplug.d/iface/99-no-ipv6
/etc/modules.d/tcp-bbr
/etc/sysctl.d/12-tcp-bbr.conf
/etc/sysctl.conf.bak-20261028
/etc/nginx/

# ---- custom init scripts ----
/etc/init.d/xray
/etc/init.d/cloudflared
/etc/init.d/ua3f2
/etc/init.d/wxdet-gate
/etc/init.d/svcroot
/etc/init.d/zram
/etc/init.d/iot-tproxy
/etc/init.d/ipidfix
/etc/init.d/sing-box
/etc/init.d/wxdet
/etc/init.d/ua3f.retired
/etc/init.d/wxdet-gate.bak-20261028

# ---- matching rc.d symlinks ----
/etc/rc.d/S99xray
/etc/rc.d/K10xray
/etc/rc.d/S99cloudflared
/etc/rc.d/S99ua3f2
/etc/rc.d/S94wxdet-gate
/etc/rc.d/K06wxdet-gate
/etc/rc.d/S98svcroot
/etc/rc.d/K01svcroot
/etc/rc.d/S15zram
/etc/rc.d/K10zram
/etc/rc.d/S18iot-tproxy
/etc/rc.d/K10iot-tproxy
/etc/rc.d/S20ipidfix
/etc/rc.d/K80ipidfix

# ---- root home (scripts, ssh keys, backups) ----
/root/

# ---- custom binaries (the svc.sq image is restored separately) ----
/usr/bin/xray
/usr/bin/ua3f
/usr/bin/wxdet-gate
/usr/bin/test-join.sh
/usr/bin/test-insert.sh

# ---- custom nft / LuCI files ----
/usr/share/nftables.d/table-post/20-miniupnpd.nft
/usr/share/nftables.d/ruleset-post/20-https-dns-proxy-notrack.nft
/www/index.html
/www/luci-static/resources/view/status/include/20_memory.js

# ---- keep rule from the xray-core package ----
/lib/upgrade/keep.d/xray-core
